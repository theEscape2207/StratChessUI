<!-- @dsCard group="Sidebar" height=300 subtitle="Closed, and open with sent, received and error lines" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../packages/client/src/tokens.css"><style>img[src^="/_blob/"] { visibility: hidden; }</style><style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: grid; gap: var(--space-3); }
  details { width: 300px; background: var(--panel); border-radius: var(--radius-md); }
  summary { padding: var(--space-3) var(--space-5); font-size: 12px; line-height: 16px; font-weight: 600; cursor: pointer; }
  summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ol { max-height: 16rem; margin: 0; padding: 0 var(--space-5) var(--space-3); overflow-y: auto; list-style: none; font: 400 12px/16px var(--font-mono); }
  li { overflow-wrap: anywhere; }
  li.received { color: var(--muted); }
  li.stderr { color: var(--notice); }
  .mark { display: inline-block; width: 1.5em; }
</style></head>
<body>
  <details><summary>UCI transcript</summary></details>
  <details open><summary>UCI transcript</summary>
    <ol>
      <li><span class="mark" aria-label="sent">→</span>position startpos moves e2e4 e7e6 d2d3</li>
      <li><span class="mark" aria-label="sent">→</span>go movetime 1000</li>
      <li class="received"><span class="mark" aria-label="received">←</span>info depth 12 seldepth 26 score cp -6 nodes 4012339 nps 4012339 pv d7d5 e4e5 c7c5</li>
      <li class="received"><span class="mark" aria-label="received">←</span>bestmove d7d5 ponder e4e5</li>
      <li class="stderr"><span class="mark" aria-label="error output">!</span>warning: hash table resized to 64 MB</li>
    </ol>
  </details>
</body></html>
