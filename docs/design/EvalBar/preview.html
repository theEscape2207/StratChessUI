<!-- @dsCard group="Analysis" height=260 subtitle="+1.0 for white, -3.2, and mate for black" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../packages/client/src/tokens.css"><style>img[src^="/_blob/"] { visibility: hidden; }</style><style>
  body { margin: 0; padding: 16px; background: var(--bg); display: flex; gap: var(--space-6); font-family: var(--font-mono); }
  .bar { position: relative; width: var(--eval-bar-width); height: 220px; background: var(--eval-black); overflow: hidden; border-radius: var(--radius-sm); outline: 1px solid var(--hairline); }
  .white { position: absolute; left: 0; right: 0; bottom: 0; background: var(--eval-white); }
  .n { position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700; }
  .n.bottom { bottom: 4px; color: var(--eval-black); }
  .n.top { top: 4px; color: var(--eval-white); }
</style></head>
<body>
  <div class="bar" role="meter" aria-label="Evaluation +1.0"><div class="white" style="height:58%"></div><span class="n bottom">1.0</span></div>
  <div class="bar" role="meter" aria-label="Evaluation -3.2"><div class="white" style="height:22%"></div><span class="n top">3.2</span></div>
  <div class="bar" role="meter" aria-label="Black mates in 4"><div class="white" style="height:0"></div><span class="n top">M4</span></div>
</body></html>
