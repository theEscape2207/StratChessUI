version: 2
updates:
  # One grouped minor/patch PR a month; majors arrive one PR each, taken deliberately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; lift this when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Tracks the Node runtime line in .nvmrc; bump both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
